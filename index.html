<title>Cosmic Tuner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400&family=Manrope:wght@300;400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --void:#04030A;
  --ink:#0B0A24;
  --violet:#8A6CFF;
  --blue:#5CC8FF;
  --silver:#BFC3D4;
  --white:#F5F4FF;
  --champ:#E8D6AE;
  --dim:rgba(191,195,212,.55);
  --hair:rgba(191,195,212,.16);
  --display:'Unbounded','Futura','Avenir Next',system-ui,sans-serif;
  --ui:'Manrope','Avenir Next',system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:
    radial-gradient(90% 60% at 50% 72%, rgba(40,28,110,.55) 0%, rgba(12,10,40,.0) 70%),
    radial-gradient(140% 90% at 50% 100%, #0D0B2C 0%, #070619 45%, var(--void) 100%);
  background-color:var(--void);
  color:var(--white);
  font-family:var(--ui);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.app{
  position:relative;height:100%;
  display:grid;grid-template-rows:auto auto 1fr auto;
  max-width:760px;margin:0 auto;
  padding-inline:max(16px, env(safe-area-inset-left, 0px));
  pointer-events:none;
}
.app button{pointer-events:auto}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:20px 0}
.mark{font:500 10px/1 var(--ui);letter-spacing:.5em;color:var(--silver)}
.pips{display:flex;gap:7px}
.pips i{width:5px;height:5px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(191,195,212,.35);transition:background .6s, box-shadow .6s}
.pips i.on{background:var(--champ);box-shadow:0 0 8px rgba(232,214,174,.9)}

/* dial */
.readout{display:grid;place-items:center;padding-block:10px 0}
.dial{position:relative;width:min(330px,88vw);aspect-ratio:300/170;max-width:100%}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial .arc{fill:none;stroke:rgba(191,195,212,.18);stroke-width:1}
.dial .tk{stroke:rgba(191,195,212,.28);stroke-width:1}
.dial .tk.mj{stroke:rgba(191,195,212,.5)}
.dial .acc{font:400 11px var(--ui);fill:rgba(191,195,212,.5)}
#arcOn{fill:none;stroke:url(#gOn);stroke-width:2;stroke-linecap:round;transition:stroke .4s}
#needle{transition:opacity .5s}
.dial.ok #arcOn{stroke:var(--champ)}
.dial.ok .arc{stroke:rgba(232,214,174,.45)}
.dial.done .arc{stroke:rgba(232,214,174,.55);filter:drop-shadow(0 0 6px rgba(232,214,174,.6))}
.dial.done .tk{stroke:rgba(232,214,174,.45)}
.dial.idle #needle{opacity:0}

.center{position:absolute;left:0;right:0;bottom:0;display:grid;justify-items:center;text-align:center}
.center > div{display:grid;justify-items:center;gap:10px}
.note{font:200 clamp(64px,17vw,92px)/.9 var(--display);letter-spacing:-.02em;color:var(--white);text-shadow:0 0 40px rgba(138,108,255,.35)}
.note sub{font-size:.26em;font-weight:300;vertical-align:baseline;margin-left:.08em;color:var(--dim);letter-spacing:0}
.state{font:600 10px/1 var(--ui);letter-spacing:.42em;text-transform:uppercase;color:var(--dim);padding-left:.42em;transition:color .3s}
.state.ok{color:var(--champ);text-shadow:0 0 14px rgba(232,214,174,.6)}
.intro .l1{font:200 clamp(24px,6.4vw,32px)/1.1 var(--display);letter-spacing:.02em}
.intro .l2{font:200 clamp(24px,6.4vw,32px)/1.1 var(--display);letter-spacing:.02em;
  background:linear-gradient(90deg,#CFC8FF,var(--champ));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro{gap:4px!important;padding-bottom:8px}
.res{font:300 clamp(20px,5.6vw,26px)/1 var(--display);letter-spacing:.34em;padding-left:.34em;
  background:linear-gradient(90deg,#DCD6FF 0%,#FFFFFF 45%,var(--champ) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;max-width:30ch;font:400 13px/1.55 var(--ui);color:var(--dim);text-wrap:balance}

#field{min-height:0}

/* controls */
.controls{display:grid;justify-items:center;gap:12px;padding-block:6px max(22px, env(safe-area-inset-bottom, 0px))}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;width:100%;max-width:420px}
.chip{
  justify-self:end;display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px 0 14px;
  border-radius:999px;border:0;cursor:pointer;color:var(--silver);
  background:rgba(11,10,36,.5);box-shadow:inset 0 0 0 1px var(--hair);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font:600 10px/1 var(--ui);letter-spacing:.3em;text-transform:uppercase;
}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue)}
.chip.manual .dot{background:var(--champ);box-shadow:0 0 10px var(--champ)}
.chip.manual{color:var(--white)}
.icon{
  justify-self:start;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  background:rgba(11,10,36,.5);box-shadow:inset 0 0 0 1px var(--hair);color:var(--silver);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.icon svg{width:16px;height:16px}
.chip:hover,.icon:hover{box-shadow:inset 0 0 0 1px rgba(191,195,212,.4)}

.orb{
  --lvl:0;
  position:relative;width:84px;height:84px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:radial-gradient(circle at 50% 38%, rgba(138,108,255,.32), rgba(11,10,36,.94) 64%);
  box-shadow:inset 0 0 0 1px rgba(191,195,212,.22), inset 0 -10px 24px rgba(92,200,255,.08), 0 14px 40px rgba(0,0,0,.55);
}
.orb .ring{
  position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0 12%, rgba(92,200,255,.95) 24%, transparent 36%, transparent 52%, rgba(138,108,255,.95) 68%, transparent 80%, rgba(232,214,174,.7) 90%, transparent 97%);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1px));
          mask:radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1px));
  opacity:.3;transition:opacity .5s;
}
.orb.on .ring{opacity:1;animation:spin 6s linear infinite}
.orb .halo{
  position:absolute;inset:-7px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 34px rgba(138,108,255,.55),0 0 70px rgba(92,200,255,.22);
  opacity:.15;transform:scale(1);
}
.orb.on .halo{opacity:calc(.3 + var(--lvl) * .7);transform:scale(calc(1 + var(--lvl) * .16))}
.orb .core{
  position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;
  background:#fff;box-shadow:0 0 12px #fff,0 0 30px rgba(138,108,255,.9);
  animation:breathe 3.2s ease-in-out infinite;
}
.orb.on .core{animation:none;transform:scale(calc(.9 + var(--lvl) * 1.6))}
.orb-label{font:600 9px/1 var(--ui);letter-spacing:.46em;padding-left:.46em;text-transform:uppercase;color:var(--dim)}
.msg{margin:0;max-width:40ch;text-align:center;font:400 12px/1.5 var(--ui);color:var(--dim);text-wrap:balance;min-height:1.5em}
.chip:focus-visible,.icon:focus-visible,.orb:focus-visible{outline:1px solid var(--blue);outline-offset:4px}

@keyframes spin{to{transform:rotate(1turn)}}
@keyframes breathe{0%,100%{transform:scale(.7);opacity:.75}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){
  .orb.on .ring,.orb .core{animation:none}
}
@media (max-height:700px){
  .dial{width:min(270px,76vw)}
  .orb{width:72px;height:72px}
}
</style>

<canvas id="sky" aria-label="Шесть струн гитары в виде световых линий. Настроенная струна становится звездой созвездия Орион."></canvas>

<div class="app">
  <header class="top">
    <div class="mark">COSMIC&nbsp;TUNER</div>
    <div class="pips" id="pips" role="img" aria-label="Настроено 0 из 6"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </header>

  <section class="readout" aria-live="polite">
    <div class="dial idle" id="dial">
      <svg viewBox="0 0 300 170" aria-hidden="true">
        <defs>
          <linearGradient id="gOn" x1="0" x2="1">
            <stop offset="0" stop-color="#8A6CFF"/><stop offset="1" stop-color="#5CC8FF"/>
          </linearGradient>
          <radialGradient id="gGlow">
            <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
            <stop offset=".35" stop-color="#8A6CFF" stop-opacity=".45"/>
            <stop offset="1" stop-color="#8A6CFF" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <g id="ticks"></g>
        <path class="arc" id="arcBase"></path>
        <path id="arcOn"></path>
        <g id="needle"><circle r="13" fill="url(#gGlow)"></circle><circle r="3.2" fill="#fff"></circle></g>
      </svg>
      <div class="center">
        <div class="intro" id="intro"><div class="l1">Шесть струн</div><div class="l2">Семь звёзд</div></div>
        <div id="live" hidden>
          <div class="note"><span id="nName">E</span><sub id="nOct">2</sub></div>
          <div class="state" id="state">Слушаю</div>
        </div>
        <div id="done" hidden>
          <div class="res">RESONANCE</div>
          <p class="sub">Шесть струн в гармонии. Из неё родилась седьмая звезда, Альнилам.</p>
        </div>
      </div>
    </div>
  </section>

  <div id="field"></div>

  <footer class="controls">
    <div class="bar">
      <button class="chip" id="mode" type="button" title="Струна определяется автоматически. Коснитесь струны на экране, чтобы выбрать её вручную."><i class="dot"></i><span id="modeTxt">Авто</span></button>
      <button class="orb" id="listen" type="button" aria-label="Слушать"><span class="halo"></span><span class="ring"></span><span class="core"></span></button>
      <button class="icon" id="reset" type="button" aria-label="Начать заново" title="Начать заново">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v3.2h3.2"/></svg>
      </button>
    </div>
    <div class="orb-label" id="orbLabel">Слушать</div>
    <p class="msg" id="msg">Коснитесь сферы и дёрните струну</p>
  </footer>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('sky'), ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;

/* ---------- Model ---------- */
const A4 = 440;
const STR = [
  {n:1, name:'E', oct:4, semi:-5,  star:'Bellatrix'},
  {n:2, name:'B', oct:3, semi:-10, star:'Betelgeuse'},
  {n:3, name:'G', oct:3, semi:-14, star:'Mintaka'},
  {n:4, name:'D', oct:3, semi:-19, star:'Alnitak'},
  {n:5, name:'A', oct:2, semi:-24, star:'Rigel'},
  {n:6, name:'E', oct:2, semi:-29, star:'Saiph'},
];
// Orion as seen from the northern hemisphere. Betelgeuse is a red supergiant, Rigel blue-white.
const STARS = {
  Betelgeuse:{x:.26, y:.13, r:1.3,  c:'255,172,112', ru:'Бетельгейзе', dx:-20, dy:16, al:'right'},
  Bellatrix: {x:.74, y:.20, r:.95,  c:'214,226,255', ru:'Беллатрикс',  dx:20,  dy:16, al:'left'},
  Mintaka:   {x:.61, y:.50, r:.82,  c:'210,224,255', ru:'Минтака',     dx:20,  dy:-12, al:'left'},
  Alnilam:   {x:.505,y:.535,r:1.1,  c:'226,234,255', ru:'Альнилам',    dx:0,   dy:-26, al:'center'},
  Alnitak:   {x:.40, y:.575,r:.92,  c:'210,224,255', ru:'Альнитак',    dx:-20, dy:14, al:'right'},
  Saiph:     {x:.32, y:.89, r:.9,   c:'202,220,255', ru:'Саиф',        dx:-20, dy:8,  al:'right'},
  Rigel:     {x:.76, y:.84, r:1.25, c:'176,206,255', ru:'Ригель',      dx:20,  dy:8,  al:'left'},
};
// Orion's sword with the Great Nebula (M42) hanging below the belt
const SWORD = [{x:.487,y:.645,r:.45},{x:.492,y:.705,r:.6},{x:.497,y:.765,r:.45}];
const M42 = {x:.492, y:.705};
const LINKS = [['Betelgeuse','Bellatrix'],['Betelgeuse','Alnitak'],['Bellatrix','Mintaka'],
  ['Mintaka','Alnilam'],['Alnilam','Alnitak'],['Alnitak','Saiph'],['Mintaka','Rigel']];

const freqOf = s => A4 * Math.pow(2, s.semi / 12);
STR.forEach((s, i) => Object.assign(s, {i, off:0, en:0, cents:0, locked:false, col:0, hold:0, birth:0}));

let field = null;
let active = null, manual = null;
let hist = [], curF = 0, lastSig = -1e9, dispC = 0;
let complete = false, cp = 0, completeAt = 0;
let ignoreUntil = 0;

/* ---------- Dial (SVG) ---------- */
const NS = 'http://www.w3.org/2000/svg';
const DC = {cx:150, cy:160, R:132, span:62};
const dpt = (c, r) => { const th = (c / 50) * DC.span * Math.PI / 180; return [DC.cx + r * Math.sin(th), DC.cy - r * Math.cos(th)]; };
(function buildDial(){
  const g = $('ticks');
  for (let c = -50; c <= 50; c += 5){
    const mj = c % 25 === 0, len = c === 0 ? 16 : mj ? 10 : 5;
    const [x1, y1] = dpt(c, DC.R - len), [x2, y2] = dpt(c, DC.R);
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('class', 'tk' + (mj ? ' mj' : ''));
    g.appendChild(l);
  }
  // diamond marker at the centre
  const [mx, my] = dpt(0, DC.R + 9);
  const d = document.createElementNS(NS, 'path');
  d.setAttribute('d', `M${mx} ${my - 3.5} L${mx + 3.5} ${my} L${mx} ${my + 3.5} L${mx - 3.5} ${my}Z`);
  d.setAttribute('fill', 'rgba(232,214,174,.8)'); g.appendChild(d);
  for (const [c, ch] of [[-58, '♭'], [58, '♯']]){
    const [x, y] = dpt(c, DC.R - 2);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y + 4); t.setAttribute('text-anchor', 'middle');
    t.setAttribute('class', 'acc'); t.textContent = ch; g.appendChild(t);
  }
  const [ax, ay] = dpt(-50, DC.R), [bx, by] = dpt(50, DC.R);
  $('arcBase').setAttribute('d', `M${ax} ${ay} A${DC.R} ${DC.R} 0 0 1 ${bx} ${by}`);
})();
function setNeedle(c){
  c = Math.max(-50, Math.min(50, c));
  const [x, y] = dpt(c, DC.R), [ox, oy] = dpt(0, DC.R);
  $('needle').setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
  $('arcOn').setAttribute('d', Math.abs(c) < .3 ? '' : `M${ox} ${oy} A${DC.R} ${DC.R} 0 0 ${c > 0 ? 1 : 0} ${x.toFixed(2)} ${y.toFixed(2)}`);
}
setNeedle(0);

/* ---------- Layout ---------- */
function resize(){
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const r = $('field').getBoundingClientRect();
  const gap = r.height / (STR.length + 1);
  field = {x:r.left, y:r.top, w:r.width, h:r.height, gap, W, H};
  field.x0 = r.left + 34;
  field.x1 = r.right;
  STR.forEach((s, i) => s.y = r.top + gap * (i + 1));
  const bh = r.height * .9, bw = Math.min((field.x1 - field.x0) * .8, bh * .76);
  const bx = field.x0 + (field.x1 - field.x0 - bw) / 2, by = r.top + (r.height - bh) / 2;
  field.box = {bx, by, bw, bh};
  const place = o => { o.px = bx + o.x * bw; o.py = by + o.y * bh; };
  for (const k in STARS) place(STARS[k]);
  SWORD.forEach(place); place(M42);
  field.orbit = Math.min(bh * .56, (field.x1 - field.x0) * .5);
}
addEventListener('resize', resize);
if ('ResizeObserver' in window) new ResizeObserver(resize).observe($('field'));

/* ---------- Audio ---------- */
let ac = null, master = null;
function audio(){
  if (!ac){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .85;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
  }
  if (ac.state !== 'running') ac.resume().catch(() => {});
  return ac;
}
const ksCache = {};
function ksBuffer(f){
  const sr = ac.sampleRate, P = Math.max(2, Math.floor(sr / f));
  if (ksCache[P]) return ksCache[P];
  const len = Math.floor(sr * 3.4), b = ac.createBuffer(1, len, sr), d = b.getChannelData(0);
  let prev = 0;
  for (let i = 0; i <= P; i++){ const v = Math.random() * 2 - 1; d[i] = (v + prev) * .5; prev = v; }
  for (let i = P + 1; i < len; i++) d[i] = .4984 * (d[i - P] + d[i - P - 1]);
  let pk = 0; for (let i = 0; i < len; i++) pk = Math.max(pk, Math.abs(d[i]));
  if (pk) for (let i = 0; i < len; i++) d[i] /= pk;
  return (ksCache[P] = {b, P});
}
function pluck(f, {when = 0, gain = .5, dur = 3.2} = {}){
  audio();
  const {b, P} = ksBuffer(f);
  const src = ac.createBufferSource(); src.buffer = b;
  const t = ac.currentTime + when;
  src.playbackRate.value = f * (P + .5) / ac.sampleRate;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = Math.min(7000, f * 16);
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .004);
  g.gain.setTargetAtTime(0, t + dur - .5, .22);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur + .4);
}
function chime(f, gain = .06, when = 0){
  audio();
  const t = ac.currentTime + when;
  [[2, 1], [4.008, .45], [6.02, .18], [8.03, .08]].forEach(([m, a]) => {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain * a, t + .03);
    g.gain.exponentialRampToValueAtTime(.0001, t + 3.2);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 3.4);
  });
}

/* ---------- Pitch detection (YIN) ---------- */
let an = null, buf = null, micOn = false, stream = null, yd = null, wake = null;
let peak = 0, peakT = 0, lvl = 0;
const GATE = .0015;
function yin(x, sr){
  const N = x.length, Wn = N >> 1;
  let rms = 0; for (let i = 0; i < N; i++) rms += x[i] * x[i];
  rms = Math.sqrt(rms / N);
  if (rms < GATE) return {f:0, rms};
  const minT = Math.floor(sr / 1100), maxT = Math.min(Wn - 2, Math.floor(sr / 62));
  if (!yd || yd.length < maxT + 2) yd = new Float32Array(maxT + 2);
  yd[0] = 1; let run = 0;
  for (let t = 1; t <= maxT + 1; t++){
    let s = 0;
    for (let j = 0; j < Wn; j++){ const v = x[j] - x[j + t]; s += v * v; }
    run += s; yd[t] = run ? s * t / run : 1;
  }
  let T = -1;
  for (let t = minT; t <= maxT; t++){
    if (yd[t] < .15){ while (t + 1 <= maxT && yd[t + 1] < yd[t]) t++; T = t; break; }
  }
  if (T < 0){
    let m = 1e9; for (let t = minT; t <= maxT; t++) if (yd[t] < m){ m = yd[t]; T = t; }
    if (m > .35) T = -1;
  }
  if (T < 1) return {f:0, rms};
  const a = yd[T - 1], b = yd[T], c = yd[T + 1], den = a + c - 2 * b;
  const sh = den ? (a - c) / (2 * den) : 0;
  return {f: sr / (T + sh), rms};
}
async function startMic(){
  audio();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ micFail(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
  } catch (e){ micFail(); return; }
  try { if (ac.state !== 'running') await ac.resume(); } catch (e){}
  const src = ac.createMediaStreamSource(stream);
  an = ac.createAnalyser(); an.fftSize = 4096; src.connect(an);
  const mute = ac.createGain(); mute.gain.value = 0; an.connect(mute); mute.connect(ac.destination);
  buf = new Float32Array(an.fftSize);
  micOn = true; peak = 0; peakT = performance.now();
  $('listen').classList.add('on'); $('orbLabel').textContent = 'Слушаю';
  say('Дёрните открытую струну');
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e){}
}
function stopMic(){
  micOn = false; lvl = 0;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; an = null;
  $('listen').classList.remove('on'); $('orbLabel').textContent = 'Слушать';
  $('listen').style.setProperty('--lvl', 0);
  try { wake && wake.release(); } catch (e){} wake = null;
  say('Коснитесь сферы и дёрните струну');
}
function micFail(){ say('Нет доступа к микрофону. Разрешите его в настройках Safari для этого сайта.'); }
function say(t){ const m = $('msg'); if (m.textContent !== t) m.textContent = t; }

const median = a => { const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };
const centsBetween = (f, g) => 1200 * Math.log2(f / g);

function feed(f, level, now){
  if (hist.length && Math.abs(centsBetween(f, median(hist))) > 80) hist = [];
  hist.push(f); if (hist.length > 5) hist.shift();
  const m = median(hist);
  let s = manual;
  if (!s){
    let bd = 1e9;
    for (const x of STR){ const c = Math.abs(centsBetween(m, freqOf(x))); if (c < bd){ bd = c; s = x; } }
    if (bd > 350) return;
  }
  curF = m; lastSig = now; active = s;
  s.cents = centsBetween(m, freqOf(s));
  s.en = Math.min(1, s.en + level * 12 + .12);
}

/* ---------- Locking & completion ---------- */
function lock(s, now){
  s.locked = true; s.col = .0001; s.hold = 0; s.birth = 0;
  chime(freqOf(s), .05);
  try { navigator.vibrate && navigator.vibrate(18); } catch (e){}
  if (manual === s) setManual(null);
  updatePips();
  if (STR.every(x => x.locked)) completeAt = now + 1400;
}
function finish(){
  complete = true; cp = 0;
  STR.slice().reverse().forEach((s, k) => pluck(freqOf(s), {when: k * .08, gain: .3, dur: 3.2}));
  chime(freqOf(STR[5]) * 2, .045, .9);
  chime(freqOf(STR[0]), .03, 1.4);
}
function resetAll(){
  STR.forEach(s => Object.assign(s, {off:0, en:0, cents:0, locked:false, col:0, hold:0, birth:0}));
  complete = false; cp = 0; completeAt = 0; active = null; hist = []; lastSig = -1e9;
  setManual(null); updatePips();
}
function updatePips(){
  const n = STR.filter(s => s.locked).length;
  [...$('pips').children].forEach((p, i) => p.classList.toggle('on', i < n));
  $('pips').setAttribute('aria-label', `Настроено ${n} из 6`);
}

/* ---------- Controls ---------- */
const SUBS = '₀₁₂₃₄₅₆₇₈₉';
const sub = n => String(n).split('').map(d => SUBS[+d]).join('');
function setManual(s){
  manual = s;
  $('mode').classList.toggle('manual', !!s);
  $('modeTxt').textContent = s ? `${s.name}${sub(s.oct)}` : 'Авто';
}
$('listen').onclick = () => micOn ? stopMic() : startMic();
$('reset').onclick = () => { resetAll(); say(micOn ? 'Дёрните открытую струну' : 'Коснитесь сферы и дёрните струну'); };
$('mode').onclick = () => setManual(null);
cv.addEventListener('pointerdown', e => {
  if (!field) return;
  const x = e.clientX, y = e.clientY;
  if (x < field.x - 8 || x > field.x1 + 8 || y < field.y || y > field.y + field.h) return;
  let s = null, bd = field.gap / 2;
  for (const k of STR){ const d = Math.abs(y - k.y); if (d < bd){ bd = d; s = k; } }
  if (!s) return;
  audio();
  if (s.locked){ s.locked = false; s.col = 0; s.off = 0; s.birth = 0; complete = false; cp = 0; completeAt = 0; updatePips(); }
  setManual(s);
  active = s; s.en = Math.max(s.en, .6);
  pluck(freqOf(s), {gain:.5});
  ignoreUntil = performance.now() + 2600;
  say(`Струна ${s.n}. Звучит эталон`);
});

/* ---------- Update ---------- */
let frame = 0, uiT = 0;
function update(dt, now){
  frame++;
  if (micOn && an && now > ignoreUntil && frame % 2 === 0){
    if (ac.state !== 'running') ac.resume().catch(() => {});
    an.getFloatTimeDomainData(buf);
    const r = yin(buf, ac.sampleRate);
    peak = Math.max(peak, r.rms);
    lvl += (Math.min(1, r.rms * 14) - lvl) * .35;
    if (r.f > 62 && r.f < 1100) feed(r.f, r.rms, now);
  }
  if (micOn && now - peakT > 1600){
    if (complete) say('Гитара настроена');
    else if (now - lastSig > 1600 && now > ignoreUntil){
      say(peak < GATE ? 'Не слышу. Поднесите телефон ближе к гитаре' : 'Дайте струне прозвучать');
    } else if (now - lastSig < 1600) say(' ');
    peak = 0; peakT = now;
  }
  const fresh = now - lastSig < 320;
  for (const s of STR){
    if (s.locked){
      if (s.col > 0 && s.col < 1){ s.col = Math.min(1, s.col + dt / 1.3); if (s.col >= 1) s.birth = now; }
      s.en *= Math.exp(-dt * 3);
      continue;
    }
    const isActive = s === active && fresh;
    if (isActive){
      const c = Math.max(-50, Math.min(50, s.cents));
      const target = -(c / 50) * field.gap * .44;
      s.off += (target - s.off) * Math.min(1, dt * 3.2);
      if (Math.abs(s.cents) < 4) s.hold += dt; else s.hold = Math.max(0, s.hold - dt * 2);
      if (s.hold >= .75) lock(s, now);
    } else {
      s.off += (0 - s.off) * Math.min(1, dt * .5);
      s.hold = Math.max(0, s.hold - dt);
      s.en *= Math.exp(-dt * 1.4);
    }
  }
  if (completeAt && now > completeAt && !complete){ completeAt = 0; finish(); }
  if (complete) cp = Math.min(1, cp + dt / 4);
  if (active) dispC += (active.cents - dispC) * Math.min(1, dt * 8);

  // per-frame UI: needle and orb level
  if (active && fresh && !complete) setNeedle(dispC);
  $('listen').style.setProperty('--lvl', micOn ? lvl.toFixed(3) : 0);

  uiT += dt;
  if (uiT > .066){ uiT = 0; renderUI(now, fresh); }
}

let uiMode = '';
function showMode(m){
  if (m === uiMode) return; uiMode = m;
  $('intro').hidden = m !== 'intro'; $('live').hidden = m !== 'live'; $('done').hidden = m !== 'done';
  const d = $('dial');
  d.classList.toggle('idle', m !== 'live');
  d.classList.toggle('done', m === 'done');
  if (m !== 'live') d.classList.remove('ok');
}
function renderUI(now, fresh){
  if (complete){ showMode('done'); return; }
  if (!active || (!fresh && now - lastSig > 4000 && !manual)){ showMode('intro'); return; }
  showMode('live');
  const s = active;
  $('nName').textContent = s.name; $('nOct').textContent = s.oct;
  const st = $('state'), d = $('dial');
  if (fresh && !s.locked){
    const ok = Math.abs(s.cents) < 4;
    d.classList.toggle('ok', ok); st.classList.toggle('ok', ok);
    st.textContent = ok ? 'Резонанс' : s.cents < 0 ? 'Подтяните' : 'Ослабьте';
  } else {
    d.classList.remove('ok');
    st.classList.toggle('ok', s.locked);
    st.textContent = s.locked ? STARS[s.star].ru : 'Дёрните струну';
    if (!fresh) setNeedle(0);
  }
}

/* ---------- Drawing ---------- */
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = v => Math.max(0, Math.min(1, v));

function fadeStroke(x0, x1, rgb, a){
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, `rgba(${rgb},0)`);
  g.addColorStop(.1, `rgba(${rgb},${a})`);
  g.addColorStop(.9, `rgba(${rgb},${a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  return g;
}
function glowPath(pts, rgb, a, fade){
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [w, al] of [[12, .035], [4.5, .12], [1.2, .95]]){
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.lineWidth = w;
    ctx.strokeStyle = fade ? fadeStroke(pts[0][0], pts[pts.length - 1][0], rgb, al * a) : `rgba(${rgb},${al * a})`;
    ctx.stroke();
  }
}
function drawStar(x, y, r, rgb, k, t, ph){
  if (k <= 0) return;
  const pulse = RM ? 1 : 1 + .05 * Math.sin(t * 1.1 + ph);
  const R = r * (8 + 6 * k) * pulse;
  let g = ctx.createRadialGradient(x, y, 0, x, y, R * 3.4);
  g.addColorStop(0, `rgba(${rgb},${.8 * k})`);
  g.addColorStop(.09, `rgba(${rgb},${.3 * k})`);
  g.addColorStop(.32, `rgba(${rgb},${.07 * k})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R * 3.4, 0, TAU); ctx.fill();
  const spike = (ang, L, al, w) => {
    const dx = Math.cos(ang) * L, dy = Math.sin(ang) * L;
    const lg = ctx.createLinearGradient(x - dx, y - dy, x + dx, y + dy);
    lg.addColorStop(0, `rgba(${rgb},0)`); lg.addColorStop(.5, `rgba(255,255,255,${al})`); lg.addColorStop(1, `rgba(${rgb},0)`);
    ctx.strokeStyle = lg; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x - dx, y - dy); ctx.lineTo(x + dx, y + dy); ctx.stroke();
  };
  spike(0, R * 1.9, .55 * k, .7); spike(Math.PI / 2, R * 1.9, .55 * k, .7);
  spike(Math.PI / 4, R * .8, .22 * k, .5); spike(-Math.PI / 4, R * .8, .22 * k, .5);
  ctx.fillStyle = `rgba(255,255,255,${Math.min(1, k)})`;
  ctx.beginPath(); ctx.arc(x, y, r * 1.7 * Math.min(1, k), 0, TAU); ctx.fill();
}
function blob(x, y, rad, rgb, a){
  const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(.5, `rgba(${rgb},${a * .35})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
}
const spaced = s => s.split('').join(' ');

function draw(t){
  const {W, H, box} = field;
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const cpE = ease(cp);
  const cA = STARS.Alnilam;

  // orbit dial: 12 divisions, one for each note
  const orr = field.orbit, rot = complete && !RM ? t * .03 : 0;
  ctx.lineWidth = 1;
  ctx.strokeStyle = `rgba(191,195,212,${.05 + .08 * cpE})`;
  ctx.beginPath(); ctx.arc(cA.px, cA.py, orr, 0, TAU); ctx.stroke();
  ctx.setLineDash([1, 7]);
  ctx.strokeStyle = `rgba(191,195,212,${.05 + .05 * cpE})`;
  ctx.beginPath(); ctx.arc(cA.px, cA.py, orr * 1.09, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  for (let i = 0; i < 12; i++){
    const a = rot + i * TAU / 12 - Math.PI / 2, L = i === 0 ? 10 : 5;
    ctx.strokeStyle = i === 0 ? `rgba(232,214,174,${.25 + .35 * cpE})` : `rgba(191,195,212,${.12 + .12 * cpE})`;
    ctx.beginPath();
    ctx.moveTo(cA.px + Math.cos(a) * orr, cA.py + Math.sin(a) * orr);
    ctx.lineTo(cA.px + Math.cos(a) * (orr + L), cA.py + Math.sin(a) * (orr + L));
    ctx.stroke();
  }

  // sockets: where the stars will be
  for (const k in STARS){
    const st = STARS[k];
    ctx.fillStyle = 'rgba(191,195,212,.16)';
    ctx.beginPath(); ctx.arc(st.px, st.py, 1.2, 0, TAU); ctx.fill();
  }

  // completion: nebula, constellation, seventh star
  if (complete){
    const nk = clamp01((cp - .25) / .6);
    if (nk > 0){
      const bh = box.bh, dr = RM ? 0 : Math.sin(t * .15) * 4;
      blob(M42.px + dr, M42.py, bh * .19, '120,90,255', .1 * nk);
      blob(M42.px - bh * .03, M42.py + bh * .02, bh * .13, '255,100,170', .1 * nk);
      blob(M42.px + bh * .035, M42.py - dr, bh * .12, '80,180,255', .09 * nk);
      blob(M42.px, M42.py, bh * .05, '255,196,160', .16 * nk);
      SWORD.forEach((s, i) => drawStar(s.px, s.py, s.r, '220,228,255', nk * .8, t, i + 11));
    }
    LINKS.forEach(([a, b], i) => {
      const p = clamp01(cp * 1.6 - i * .09);
      if (p <= 0) return;
      const A = STARS[a], B = STARS[b], e = ease(p);
      const ex = lerp(A.px, B.px, e), ey = lerp(A.py, B.py, e);
      const lg = ctx.createLinearGradient(A.px, A.py, B.px, B.py);
      lg.addColorStop(0, 'rgba(200,190,255,.4)'); lg.addColorStop(1, 'rgba(140,200,255,.4)');
      ctx.strokeStyle = lg; ctx.lineWidth = .8;
      ctx.beginPath(); ctx.moveTo(A.px, A.py); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = 'rgba(138,108,255,.06)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(A.px, A.py); ctx.lineTo(ex, ey); ctx.stroke();
      if (p >= 1 && !RM){
        const q = (t * .22 + i * .37) % 1;
        const px = lerp(A.px, B.px, q), py = lerp(A.py, B.py, q);
        blob(px, py, 7, '232,214,174', .55 * Math.sin(q * Math.PI));
      }
    });
    const k7 = clamp01((cp - .42) * 2.2);
    if (k7 > 0){
      const bloom = Math.sin(k7 * Math.PI) * .6;
      if (bloom > 0) blob(cA.px, cA.py, field.h * .6, '138,108,255', .2 * bloom);
      drawStar(cA.px, cA.py, cA.r * 1.2, cA.c, k7 * 1.2, t, 7);
    }
  }

  // strings
  const x0 = field.x0, x1 = field.x1, span = x1 - x0, N = 90, now = performance.now();
  for (const s of STR){
    const st = STARS[s.star];
    if (s.locked && s.col >= 1){
      drawStar(st.px, st.py, st.r, st.c, 1, t, s.i);
      if (s.birth){
        const p = (now - s.birth) / 1500;
        if (p < 1){
          ctx.strokeStyle = `rgba(232,214,174,${(1 - p) * .6})`; ctx.lineWidth = .9;
          ctx.beginPath(); ctx.arc(st.px, st.py, 6 + ease(p) * 70, 0, TAU); ctx.stroke();
        }
      }
      continue;
    }
    const isActive = s === active && !s.locked;
    if (s.locked){
      const e = ease(s.col);
      const ax = lerp(x0, st.px, e), ay = lerp(s.y, st.py, e);
      const bx = lerp(x1, st.px, e), by = lerp(s.y, st.py, e);
      glowPath([[ax, ay], [bx, by]], '240,232,210', 1 - e * .5, true);
      drawStar(st.px, st.py, st.r, st.c, e * e, t, s.i);
      continue;
    }
    if (isActive && Math.abs(s.off) > 2){
      ctx.setLineDash([1.5, 6]); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(232,214,174,.28)';
      ctx.beginPath(); ctx.moveTo(x0 + span * .06, s.y); ctx.lineTo(x1 - span * .06, s.y); ctx.stroke(); ctx.setLineDash([]);
    }
    const amp = (RM ? .3 : .7) + s.en * field.gap * (RM ? .06 : .2);
    const ts = RM ? .1 : 1, w1 = (38 + s.i * 7) * ts, w2 = (61 + s.i * 9) * ts;
    const pts = [];
    for (let j = 0; j <= N; j++){
      const u = j / N, env = Math.sin(Math.PI * u);
      const y = s.y + s.off * env
        + amp * (env * Math.sin(t * w1) + .35 * Math.sin(TAU * u) * Math.sin(t * w2 + 1))
        + (s.en < .05 ? .6 * Math.sin(u * 9 + t * .9 + s.i) * env : 0);
      pts.push([x0 + u * span, y]);
    }
    const close = isActive ? clamp01(1 - Math.abs(s.cents) / 30) : 0;
    const rgb = isActive
      ? `${Math.round(lerp(92, 240, close))},${Math.round(lerp(200, 226, close))},${Math.round(lerp(255, 190, close))}`
      : '191,195,212';
    glowPath(pts, rgb, isActive ? 1 : .5 + s.en * .45, true);
    if (isActive && s.hold > 0){
      const k = Math.min(1, s.hold / .75);
      drawStar(st.px, s.y + s.off * Math.sin(Math.PI * (st.px - x0) / span), st.r * .7, '232,214,174', k * .8, t, s.i);
    }
  }

  // star names
  ctx.globalCompositeOperation = 'source-over';
  ctx.font = '600 8.5px Manrope, system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  const label = (st, a) => {
    ctx.fillStyle = `rgba(191,195,212,${a})`;
    ctx.textAlign = st.al;
    ctx.fillText(spaced(st.ru.toUpperCase()), st.px + st.dx, st.py + st.dy);
  };
  for (const s of STR){
    if (!s.locked || s.col < 1) continue;
    label(STARS[s.star], .5 * clamp01((now - s.birth) / 800));
  }
  if (complete && cp > .6){
    ctx.font = '600 9px Manrope, system-ui, sans-serif';
    ctx.fillStyle = `rgba(232,214,174,${Math.min(.9, (cp - .6) * 3)})`;
    ctx.textAlign = 'center';
    ctx.fillText(spaced('АЛЬНИЛАМ'), cA.px + cA.dx, cA.py + cA.dy);
  }

  // string names
  for (const s of STR){
    const isA = (s === active || s === manual) && !s.locked;
    const a = s.locked ? .22 : isA ? 1 : .5;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = isA ? `rgba(245,244,255,${a})` : `rgba(191,195,212,${a})`;
    ctx.font = '300 15px Unbounded, system-ui, sans-serif';
    ctx.fillText(s.name, field.x, s.y);
    const nw = ctx.measureText(s.name).width;
    ctx.font = '400 8px Manrope, system-ui, sans-serif';
    ctx.fillStyle = `rgba(191,195,212,${a * .7})`;
    ctx.fillText(s.oct, field.x + nw + 2, s.y + 6);
  }
}

/* ---------- Loop ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (field){ update(dt, now); draw(now / 1000); }
  requestAnimationFrame(loop);
}
resize();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(resize);
requestAnimationFrame(loop);
})();
</script>
